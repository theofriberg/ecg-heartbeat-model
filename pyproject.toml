[project]
name = "heartbeat"
version = "0.1.0"
description = "Neural network training and evaluation pipeline for ECG heartbeat classification"
authors = [
    { name = "theofriberg", email = "friberg.theodor77@live.se" }
]
requires-python = ">=3.13"
dependencies = [
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    # torch 2.15 MPS kernels crash on macOS 14 (need macOS 15+). Lift this pin after upgrading macOS.
    "torch>=2.14,<2.15",
    "tqdm>=4.70.1",
]

[project.scripts]
heartbeat = "heartbeat.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
